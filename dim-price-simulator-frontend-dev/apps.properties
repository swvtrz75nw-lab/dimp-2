# =============================================================================
# apps.properties — Multi-App Pipeline Configuration
# =============================================================================
# Maintained by developers. This file drives the CI/CD pipeline.
# The pipeline reads this file to know which apps exist, what to call their
# Docker images, and which scans to run.
#
# ADDING A NEW SERVICE:
#   1. Add the folder name to the `apps` list (comma-separated, no spaces)
#   2. Add a <folder>.image_name entry
#   3. Optionally override scan flags per-app (see examples at the bottom)
# =============================================================================

# ── Application folder names (relative to repo root) ─────────────────────────
apps=dimp-frontend-dev-ui

# ── Docker image names (folder_name.image_name = docker-image-name) ──────────
dimp-frontend-dev-ui.image_name=dimp-simulator-ui

# ── ECS service names (folder_name.ecs_service = ecs-service-name) ───────────
# Defaults to image_name if not set
dimp-frontend-dev-ui.ecs_service=dimp-simulator-ui

# ── Global scan toggles ───────────────────────────────────────────────────────
# Set to true/false to enable or disable scans for ALL apps.
# Individual apps can override these below.
run_sonarqube=false
run_polaris=false
run_pylint=false

# ── Per-app scan overrides (uncomment and edit as needed) ─────────────────────
# Format: <folder_name>.run_<scan>=true|false
#
# Example: disable Polaris for a service that has no external dependencies
# market_data_service.run_polaris=false
#
# Example: disable SonarQube for a stub/scaffold service not yet ready
# simulation_runner.run_sonarqube=false
